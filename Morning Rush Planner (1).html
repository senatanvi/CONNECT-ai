const JT=['Waterloo','Southwark','London Bridge','Bermondsey','Canada Water','Canary Wharf'],NL=['walk1','bus','jub','walk2'];
const X2={normal:{l:NL,tp:JT},rain:{l:NL,tp:JT},dis:{l:['walk1','bus','wc','chg','dlr','walk2'],tp:['Waterloo','Bank','Canary Wharf'],bad:{Jubilee:2}},traf:{l:NL,tp:JT,tb:1},long:{l:NL,tp:JT,tb:.8},late:{l:NL,tp:JT},fast:{l:NL,tp:JT,tb:-.6},slow:{l:NL,tp:JT,tb:.4},none:{l:['walk1','bus','rep','walk2'],tp:JT,bad:{Jubilee:3},tb:.6},dest:{l:['walk1','bus','nor','walk3'],tp:['Waterloo','Bank','Moorgate','Old Street']}};
function buildRoute(){const x=X2[cur],q=S[cur];let t=m(q.leave);const legs=q.steps.map((st,i)=>{const g=x.l[i],pts=GE[g]?L(GE[g]):null,o={t,g,pts,mins:st[0],name:st[1],rng:st[2],col:LC[g]||'#5f6368',walk:g.startsWith('walk')};t+=st[0];if(pts){const v=pts.map(p=>dbmAt(sel,p)-(/jub|wc|nor/.test(g)?14:0));o.sig=v.reduce((a,b)=>a+b)/v.length}return o});route={legs,end:t,all:legs.flatMap(l=>l.pts||[])};TP=x.tp;BAD=x.bad||{};TB=x.tb||0}
// ---- canvas
const cv=$('map'),cx=cv.getContext('2d');let cw=0,ch=0,dpr=1,s=18,ox=0,oy=0;
function resize(){dpr=window.devicePixelRatio||1;cw=cv.clientWidth;ch=cv.clientHeight;cv.width=cw*dpr;cv.height=ch*dpr}
const X=p=>p[0]*s+ox,Y=p=>p[1]*s+oy;
function path(a){cx.beginPath();a.forEach((p,i)=>i?cx.lineTo(X(p),Y(p)):cx.moveTo(X(p),Y(p)))}
function drawRoute(){if(!route)return;cx.lineJoin=cx.lineCap='round';for(const l of route.legs){if(!l.pts)continue;path(l.pts);cx.strokeStyle='#fff';cx.lineWidth=l.walk?8:12;cx.stroke();path(l.pts);cx.strokeStyle=l.col;cx.lineWidth=l.walk?4.5:7;if(l.walk)cx.setLineDash([.1,9]);cx.stroke();cx.setLineDash([])}
 const a=route.all[0],b=route.all[route.all.length-1];cx.fillStyle='#fff';cx.beginPath();cx.arc(X(a),Y(a),9,0,6.283);cx.fill();cx.fillStyle='#1a73e8';cx.beginPath();cx.arc(X(a),Y(a),6,0,6.283);cx.fill();pin(b,'#ea4335')}
function draw(){if(tab==='plan'||!cw)return;cx.setTransform(dpr,0,0,dpr,0,0);if(eff()){drawTube();return}
 cx.fillStyle='#bcdcf3';cx.fillRect(0,0,cw,ch);drawLand();
 cx.fillStyle='#c8e6c9';for(const k of parks){cx.beginPath();cx.ellipse(X(k),Y(k),k[2]*s,k[3]*s,0,0,6.283);cx.fill()}
 cx.lineJoin=cx.lineCap='round';cx.strokeStyle='#aadaff';cx.lineWidth=Math.max(s<6?1.2:3,.22*s);path(thames);cx.stroke();drawWater();
 if(LY.sig){cx.globalAlpha=.7;cx.imageSmoothingEnabled=true;cx.drawImage(heat(sel),ox,oy,GW*CS*s,GH*CS*s);cx.globalAlpha=1}
 const rd=(a,w,c,cs)=>{cx.strokeStyle=cs;cx.lineWidth=w+2;path(a);cx.stroke();cx.strokeStyle=c;cx.lineWidth=w;path(a);cx.stroke()};
 drawNat();drawStreets();if(s>=4)for(const r of roads)rd(r,Math.max(2,.09*s),'#fff','#9aa0a6');if(s>=3)rd(m25,Math.max(2.5,.1*s),'#fcc34b','#e0a030');
 if(LY.traf)trafficDraw();drawRoute();
 cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=3;cx.strokeStyle='rgba(255,255,255,.9)';
 const lb=(t,x,y,c,f)=>{cx.font=f;cx.fillStyle=c;cx.strokeText(t,x,y);cx.fillText(t,x,y)};
 if(s>20){if(s>28)for(const k of parks)lb(k[4],X(k),Y(k),'#188038','italic 11px Roboto,Arial');lb('River Thames',X(P(-.17,51.4825)),Y(P(-.17,51.4825))+14,'#4285f4','italic 11px Roboto,Arial')}
 if(s>5)lb('M25',X(P(-.14,51.69)),Y(P(-.14,51.69)),'#b06000','500 11px Roboto,Arial');
 for(const p of places)if(p[3]===1?s>=7:s>=16)lb(p[2],X(p),Y(p),p[3]===1?'#3c4043':'#5f6368',(p[3]===1?'500 12.5px':'11.5px')+' Roboto,Arial');
 drawGeoLabels(lb);if(s>10)lb('LONDON',X(C0),Y(C0)-s*2.2,'#80868b','500 '+Math.min(22,s*.9)+'px Roboto,Arial');
 if(mark)pin(mark,'#ea4335')}
function zoom(f,x,y){const n=clamp(s*f,eff()?5:.35,eff()?60:220);ox=x-(x-ox)*n/s;oy=y-(y-oy)*n/s;s=n;draw()}
const ptr=new Map();let moved=0;const rc=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,rc(e));moved=0});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),n=rc(e);
 if(ptr.size===1){ox+=n[0]-o[0];oy+=n[1]-o[1];moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1])}
 else{const q=[...ptr.entries()].find(a=>a[0]!==e.pointerId)[1],d0=Math.hypot(o[0]-q[0],o[1]-q[1]),d1=Math.hypot(n[0]-q[0],n[1]-q[1]);moved+=99;zoom(d1/d0,(n[0]+q[0])/2,(n[1]+q[1])/2)}
 ptr.set(e.pointerId,n);draw()});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(moved<6&&!ptr.size){const p=rc(e);pick(p[0],p[1])}});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();const p=rc(e);zoom(e.deltaY<0?1.2:1/1.2,p[0],p[1])},{passive:false});
$('zi').onclick=()=>zoom(1.4,cw/2,ch/2);$('zo').onclick=()=>zoom(1/1.4,cw/2,ch/2);
const provRows=fn=>Object.entries(PROV).map(([k,v])=>{const d=fn(k),[t,n]=lvl(d);return`<div class="pr"><span class="dot" style="background:${v.c}"></span><span class="nm">${v.name}</span><span class="bars">${[1,2,3,4,5].map(i=>`<i style="height:${i*20}%;${i<=n?'background:'+(n>3?'#1e8e3e':n>2?'#f9ab00':'#d93025'):''}"></i>`).join('')}</span><span class="v">${t} · ${Math.round(d)} dBm</span></div>`}).join('');
function card(h){$('card').innerHTML=h?h+'<button class="x" onclick="card();mark=null;draw()">×</button>':'';$('card').style.display=h?'block':'none'}
function pick(px,py){if(eff())return tubePick(px,py);if(!LY.sig){card();return}const p=[(px-ox)/s,(py-oy)/s];if(p[0]<0||p[1]<0||p[0]>=W||p[1]>=H){card();mark=null;return draw()}mark=p;card(`<h3>Signal here</h3><p>${tech} · tap elsewhere to compare</p>`+provRows(k=>dbmAt(k,p)));draw()}
function tubePick(px,py){let b=null,bd=22;for(const n in ST){const d=Math.hypot(ox+ST[n].x*s-px,oy+ST[n].y*s-py);if(d<bd){bd=d;b=n}}if(!b)return card();card(`<h3>${b}</h3><p>${ST[b].ln.join(' · ')} · ${tech} (underground estimate)</p>`+provRows(k=>stDbm(b,k)))}
function fitBox(x0,y0,x1,y1,mw,mh){const top=tab==='tube'?150:130,bot=(sheet==='full'?ch*.54:178)+80,hh=ch-top-bot;s=clamp(Math.min((cw-50)/Math.max(x1-x0,mw),hh/Math.max(y1-y0,mh)),eff()?5:4,eff()?60:150);ox=cw/2-(x0+x1)/2*s;oy=top+hh/2-(y0+y1)/2*s}
function fitRoute(){const a=route.all;fitBox(Math.min(...a.map(p=>p[0])),Math.min(...a.map(p=>p[1])),Math.max(...a.map(p=>p[0])),Math.max(...a.map(p=>p[1])),.8,.8)}
function fitTube(){const a=(TP.length?TP:Object.keys(ST)).map(n=>ST[n]);fitBox(Math.min(...a.map(p=>p.x)),Math.min(...a.map(p=>p.y)),Math.max(...a.map(p=>p.x)),Math.max(...a.map(p=>p.y)),16,12)}
// ---- UI
const tgt=t=>/Jubilee|Northern|Bank|DLR|line|Rerouted/i.test(t)?'tube':/traffic|bus|road/i.test(t)?'traf':/walk|Dry|rain/i.test(t)?'map':'';
function renderPlan(){const q=S[cur],lv=m(q.leave),arr=q.arrT||f(m(q.arr))+' '+ap(m(q.arr)),
 wk=q.now?`<div class="lab">IT’S NOW</div><div class="big">${T(m(q.now))}</div><div class="meta">Planned wake-up was 6:55 AM</div>`:`<div class="lab">WAKE UP</div><div class="big">${T(m(q.wake))}</div>${q.oldW?`<div class="was">was ${f(m(q.oldW))} AM</div>`:''}`;let t=lv;
 const steps=q.steps.map(x=>{const r=`<div class="step"><time>${f(t)}</time><div>${x[1]}<small>${x[2]}</small></div></div>`;t+=x[0];return r}).join('')+`<div class="step"><time>${f(t)}</time><div><b>Arrive</b><small>${q.arrT?'Uncertain: 8:40–9:20':'Due '+q.due+' · usually '+q.rng}</small></div></div>`;
 const alts=cur==='none'||cur==='late'?'':`<div class="h">OTHER OPTIONS</div><div class="alt"><div>Most reliable<small>Extra 8 min buffer</small></div><b>Leave ${f(lv-8)}</b></div><div class="alt"><div>Latest wake-up<small>Thinner buffer, 3 min to spare</small></div><b>Leave ${f(lv+10)}</b></div>`;
 $('plan').innerHTML=`<div class="top"><b>Monday morning</b><span>To ${dest()} · due ${q.due}</span></div>${q.banner?`<div class="banner t-${q.banner[0]}"><b>${q.banner[1]}</b>${q.banner[2]}</div>`:''}
 <section class="hero">${wk}<div class="row2"><div><div class="lab">LEAVE</div><div class="mid">${T(lv)}</div>${q.oldL?`<div class="was">was ${f(m(q.oldL))} AM</div>`:''}</div><div><div class="lab">ARRIVE</div><div class="mid" style="${q.arrT?'font-size:30px;padding-top:9px':''}">${q.arrT||T(m(q.arr))}</div><div class="meta">${q.arrT?'low confidence':'due '+q.due}</div></div></div>
 <div class="dur">${q.arrT?'55–95 min':q.dur+' min'} journey <span>${q.arrT?'very uncertain':'usually '+q.rng}</span></div>${q.pill?`<span class="pill t-${q.pill[0]}">${q.pill[1]}</span>`:''}</section>
 <ul class="why">${q.why.map(w=>{const g=tgt(w[1]);return`<li class="${g?'go':''}" ${g?`onclick="goTo('${g}')"`:''}><i class="d-${w[0]}"></i><span>${w[1]}</span>${g?'<em>›</em>':''}</li>`}).join('')}</ul>
 <div class="watch"><b>WHAT COULD CHANGE THIS</b>${q.watch}</div><button class="cta" onclick="goTo('start')">${q.cta}</button>${q.link?`<button class="link">${q.link}</button>`:''}
 <details class="more"><summary>Explore your journey</summary>${steps}<div class="two2"><button onclick="goTo('map')">View on map</button><button onclick="goTo('tube')">View on Tube map</button></div>${alts}</details>`;
 $('pre').innerHTML=Object.keys(S).map(k=>`<button class="${k===cur?'on':''}" onclick="setScenario('${k}')">${S[k].l}</button>`).join('')}
function goTo(g){if(g==='traf')LY.traf=true;if(g==='start'){sheet='full';applySheet();g='map'}setTab(g==='tube'?'tube':'map')}
function setScenario(k){cur=k;SV={};buildRoute();renderPlan();if(tab!=='plan'){tab==='tube'?fitTube():fitRoute();renderMapUI();draw()}}
function lyr(k){LY[k]=!LY[k];renderMapUI();draw()}
function selP(k){sel=k;buildRoute();renderPlan();renderMapUI();draw()}
function setTech(t){tech=t;buildRoute();renderMapUI();draw()}
function provUI(){const on=(tab==='map'&&LY.sig)||tab==='tube',p=$('prov');p.style.display=on?'block':'none';if(!on)return;
 p.innerHTML='<div class="chips">'+[['best','All networks','conic-gradient(#00a5a3,#e60000,#1c3fd1,#7a2bd1,#00a5a3)'],...Object.entries(PROV).map(([k,v])=>[k,v.name,v.c])].map(c=>`<button class="chip ${sel===c[0]?'on':''}" onclick="selP('${c[0]}')"><span class="dot" style="background:${c[2]}"></span>${c[1]}</button>`).join('')+['4G','5G'].map(t=>`<button class="chip ${tech===t?'on':''}" onclick="setTech('${t}')">${t}</button>`).join('')+'</div><div class="leg"><span>Weak</span><i></i><span>Strong</span></div>'}
function sheetUI(){const q=S[cur],lv=m(q.leave),nb=q.banner?`<div class="note t-${q.banner[0]}"><b>${q.banner[1]}.</b> ${q.banner[2]}</div>`:'';let h;
 if(tab==='map'){h=`<div class="sh-t">${f(lv)}<small>${ap(lv)} · leave</small></div><div class="sh-s">${q.arrT?'55–95 min, very uncertain':q.dur+' min'} · arrive ${q.arrT||f(m(q.arr))} · due ${q.due}</div>${nb}<div class="cond"><span>${q.why[1][1].replace(/\.$/,'')}</span><span>${q.why[2][1].replace(/\.$/,'')}</span></div><div class="full-only">${route.legs.map(l=>`<div class="leg-r"><time>${f(l.t)}</time><i style="background:${l.col};${l.walk?'opacity:.45':''}"></i><div><b>${l.name}</b><small>${l.rng}</small></div>${l.sig!=null?`<span class="sg"><u style="background:${rgb(l.sig)}"></u>${lvl(l.sig)[0]}</span>`:''}</div>`).join('')}<div class="leg-r"><time>${f(route.end)}</time><i style="background:#ea4335"></i><div><b>Arrive at ${dest()}</b><small>Due ${q.due}</small></div></div><p class="sub">Signal shown for ${sel==='best'?'all networks':PROV[sel].name} (${tech}). Underground values are simulated.</p></div>`}
 else{const w=TP.map(n=>stDbm(n)).filter(d=>d<-100).length;h=(TP.length?`<div class="sh-t" style="font-size:20px">${TP[0]} → ${TP[TP.length-1]}</div><div class="sh-s">${TP.length} stations · ${w?w+' with weak signal':'signal fine throughout'}</div>`:'')+nb+`<div class="full-only"><div class="h">LINE STATUS</div>${TL.map(l=>{const b=BAD[l[0]]||0;return`<div class="stt"><i style="background:${l[1]}"></i><span>${l[0]}${b?`<small>${b>2?'Suspended between Waterloo and Stratford':'Signal failure at Waterloo'}</small>`:''}</span><b style="color:${SC[b]};font-size:13px">${STXT[b]}</b></div>`}).join('')}<p class="sub">Dots show estimated signal inside stations; dashed grey lines are disrupted.</p></div>`}
 $('shc').innerHTML=h}
function renderMapUI(){const q=S[cur];$('srch').innerHTML=`<span class="bk">‹</span><span><b>To ${dest()}</b><small>Leave ${f(m(q.leave))} · due ${q.due}</small></span><span class="av">R</span>`;
 $('mchips').innerHTML=[['traf','🚦','Traffic'],['sig','📶','Signal']].map(c=>`<button class="chip ${LY[c[0]]?'on':''}" onclick="lyr('${c[0]}')">${c[1]} ${c[2]}</button>`).join('')+(cur==='rain'?'<span class="chip info">☂ Rain 7:40–9:00</span>':'');
 $('tsub').textContent=`Signal at stations · ${sel==='best'?'All networks':PROV[sel].name} · ${tech}`;provUI();sheetUI()}
function applySheet(){$('sheet').className='sheet '+sheet;$('app').style.setProperty('--sh',sheet==='full'?'54dvh':'178px')}
$('grab').onclick=()=>{sheet=sheet==='full'?'peek':'full';applySheet()};$('srch').onclick=()=>setTab('plan');$('fit').onclick=()=>{tab==='tube'?fitTube():fitRoute();draw()};
function setTab(t){if(tab!=='plan')SV[tab]={s,ox,oy};tab=t;$('app').dataset.tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));card();mark=null;
 if(t==='plan'){$('v-plan').scrollTop=0;return}resize();const v=SV[t];if(v){s=v.s;ox=v.ox;oy=v.oy}else t==='map'?fitRoute():fitTube();renderMapUI();draw()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
addEventListener('resize',()=>{if(tab!=='plan'){resize();draw()}});
buildRoute();renderPlan();applySheet();

</script></body></html>
